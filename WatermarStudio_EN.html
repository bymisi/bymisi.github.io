<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Video Studio — Gamer Edition</title>
<style>
:root{--bg:#f4f6f4;--card:#fff;--fg:#1a1d1a;--mut:#667066;--acc:#1f9d55;--accfg:#fff;--bd:#d9ded9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111411;--card:#1b1f1b;--fg:#e8ece8;--mut:#9aa59a;--acc:#4ade80;--accfg:#06210f;--bd:#2c332c}}
:root[data-theme="dark"]{--bg:#111411;--card:#1b1f1b;--fg:#e8ece8;--mut:#9aa59a;--acc:#4ade80;--accfg:#06210f;--bd:#2c332c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:8px 0 2px}
p.sub{color:var(--mut);margin:0 0 16px;font-size:.92rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
label{display:block;font-size:.85rem;color:var(--mut);margin:10px 0 4px}
input[type=text],select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);font:inherit}
.row{display:flex;gap:10px}.row>div{flex:1}
button{font:inherit;border:0;border-radius:10px;padding:12px 16px;background:var(--acc);color:var(--accfg);font-weight:600;cursor:pointer}
button.sec{background:transparent;color:var(--fg);border:1px solid var(--bd)}
button:disabled{opacity:.5}
.file{border-top:1px solid var(--bd);padding:10px 0}
.file:first-child{border-top:0}
.name{word-break:break-all;font-size:.92rem}
.meta{color:var(--mut);font-size:.8rem}
.bar{height:8px;background:var(--bg);border-radius:6px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;width:0;background:var(--acc)}
.note{color:var(--mut);font-size:.82rem}
.hide{display:none}

/* Kiemelt letöltési gomb stílus */
#downloads{display:flex;flex-direction:column;gap:8px;margin:8px 0 12px}
a.dl{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  width:100%;
  padding:13px 16px;
  border-radius:11px;
  background:linear-gradient(135deg,#22c55e,#10b981);
  color:#031f0e !important;
  font-weight:800;
  font-size:.92rem;
  text-decoration:none;
  text-align:center;
  border:1px solid #6ee7b7;
  box-shadow:0 4px 16px rgba(16,185,129,.35);
}
a.dl:active{transform:scale(0.99)}

#ratioPanel{
      --bg-primary: #0b0f19;
      --bg-card: #131a2a;
      --bg-elevated: #1b2438;
      --bg-input: #0e1422;
      --border: #26324d;
      --border-focus: #38bdf8;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.15);
      --success: #34d399;
      --warning: #fbbf24;
      --purple: #a78bfa;
      --radius-lg: 16px;
      --radius-md: 10px;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }
#ratioPanel *{
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
#ratioPanel{
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: var(--font-sans);
      line-height: 1.5;
      padding: 20px 16px 48px;
      min-height: 100vh;
    }
#ratioPanel .container{
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
#ratioPanel header{
      text-align: center;
      padding: 8px 0;
    }
#ratioPanel header h1{
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-main);
    }
#ratioPanel header p{
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 4px;
    }
#ratioPanel #error-banner{
      display: none;
      background-color: #450a0a;
      border: 1px solid #ef4444;
      color: #fca5a5;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      font-family: var(--font-mono);
      font-size: 0.85rem;
    }
#ratioPanel .card{
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }
#ratioPanel .section-title{
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
#ratioPanel .screen-grid{
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }
#ratioPanel .stat-box{
      background-color: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 14px;
    }
#ratioPanel .stat-label{
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
#ratioPanel .stat-value{
      font-family: var(--font-mono);
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
    }
#ratioPanel .stat-sub{
      font-size: 0.72rem;
      color: var(--accent);
      margin-top: 2px;
    }
#ratioPanel .btn-row{
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
#ratioPanel button{
      background-color: var(--bg-elevated);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
#ratioPanel button:hover{
      border-color: var(--accent);
      background-color: #222e47;
    }
#ratioPanel button.primary{
      background-color: var(--accent);
      color: #06101d;
      border-color: var(--accent);
    }
#ratioPanel button.primary:hover{
      background-color: #7dd3fc;
    }
#ratioPanel .input-row{
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 12px;
      align-items: end;
    }
#ratioPanel .input-group label{
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 600;
    }
#ratioPanel .input-group input{
      width: 100%;
      background-color: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      color: var(--text-main);
      font-family: var(--font-mono);
      font-size: 1.2rem;
      font-weight: 700;
      outline: none;
      transition: border-color 0.15s;
    }
#ratioPanel .input-group input:focus{
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
#ratioPanel .swap-btn{
      padding: 12px 14px;
      font-size: 1.1rem;
      height: 48px;
    }
#ratioPanel .presets{
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 14px;
    }
#ratioPanel .preset-chip{
      font-size: 0.78rem;
      padding: 5px 10px;
      border-radius: 999px;
      font-family: var(--font-mono);
    }
#ratioPanel .results-grid{
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 14px;
    }
#ratioPanel .result-card{
      background-color: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
    }
#ratioPanel .result-card.highlight{
      border-color: var(--accent);
      background: linear-gradient(145deg, #1b2438 0%, #132238 100%);
    }
#ratioPanel .result-big{
      font-family: var(--font-mono);
      font-size: 1.65rem;
      font-weight: 800;
      color: var(--accent);
      margin: 4px 0;
    }
#ratioPanel .result-card.green .result-big{
      color: var(--success);
    }
#ratioPanel .result-card.purple .result-big{
      color: var(--purple);
    }
#ratioPanel .result-desc{
      font-size: 0.8rem;
      color: var(--text-muted);
    }
#ratioPanel .preview-wrapper{
      margin-top: 18px;
      background-color: var(--bg-input);
      border: 1px dashed var(--border);
      border-radius: var(--radius-md);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 210px;
    }
#ratioPanel .box-stage{
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 160px;
    }
#ratioPanel .rect-std{
      position: absolute;
      border: 2px dashed var(--success);
      background-color: rgba(52, 211, 153, 0.08);
      border-radius: 6px;
      transition: all 0.25s ease;
    }
#ratioPanel .rect-user{
      position: absolute;
      border: 2px solid var(--accent);
      background-color: rgba(56, 189, 248, 0.16);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-main);
      transition: all 0.25s ease;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
    }
#ratioPanel .legend{
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 14px;
      font-size: 0.78rem;
      color: var(--text-muted);
    }
#ratioPanel .legend span{
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
#ratioPanel .dot-user{
      width: 12px;
      height: 12px;
      border: 2px solid var(--accent);
      background: rgba(56, 189, 248, 0.2);
      border-radius: 3px;
    }
#ratioPanel .dot-std{
      width: 12px;
      height: 12px;
      border: 2px dashed var(--success);
      background: rgba(52, 211, 153, 0.1);
      border-radius: 3px;
    }
#ratioPanel details{
      background-color: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
    }
#ratioPanel summary{
      padding: 14px 16px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      user-select: none;
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
#ratioPanel summary::-webkit-details-marker{
      display: none;
    }
#ratioPanel summary::after{
      content: "▼";
      font-size: 0.75rem;
      color: var(--accent);
      transition: transform 0.2s;
    }
#ratioPanel details[open] summary::after{
      transform: rotate(180deg);
    }
#ratioPanel .steps-body{
      padding: 0 16px 16px;
      border-top: 1px solid var(--border);
      font-size: 0.85rem;
      color: var(--text-muted);
    }
#ratioPanel .step-list{
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 0.82rem;
      max-height: 240px;
      overflow-y: auto;
      padding-right: 4px;
    }
#ratioPanel .step-item{
      background-color: var(--bg-input);
      padding: 6px 10px;
      border-radius: 6px;
      border-left: 3px solid var(--border);
    }
#ratioPanel .step-item.final{
      border-left-color: var(--success);
      color: var(--success);
      font-weight: 700;
    }
#ratioPanel .correction-box{
      margin-top: 14px;
      padding: 12px 14px;
      background-color: var(--bg-input);
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      font-size: 0.84rem;
    }
#ratioPanel .correction-box strong{
      color: var(--warning);
    }
@media (max-width: 540px){#ratioPanel .input-row{
        grid-template-columns: 1fr;
      }
#ratioPanel .swap-btn{
        width: 100%;
      }

    }

  
:root{--bg:#070b14;--card:#101a2b;--fg:#e8f3ff;--mut:#8da4bd;--acc:#38d9ff;--accfg:#03121a;--bd:#233b56;--neon:#38d9ff;--green:#35e6a2}
body{background:radial-gradient(ellipse at 50% -20%,#16345a 0%,#080e1b 48%,#050810 100%);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1000px;margin:0 auto;padding:clamp(8px,2vw,18px)}
.app-head{display:flex;align-items:center;gap:12px;margin:2px 0 12px}
.brand-mark{width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--acc);border-radius:13px;color:var(--acc);font-size:22px;background:#0b2234;box-shadow:0 0 20px #38d9ff24}
h1{font-size:clamp(1.15rem,4vw,1.65rem);letter-spacing:.08em;margin:0;color:#f3fbff}
h1 small{display:block;font-size:.52em;letter-spacing:.2em;color:var(--acc)}
p.sub{font-size:.76rem;color:var(--mut);margin:2px 0 0}
.card{background:linear-gradient(145deg,#111e31,#0b1423);border:1px solid #24415e;border-radius:14px;padding:clamp(10px,2vw,15px);margin-bottom:10px;box-shadow:0 8px 25px #0005}
label{color:#a8bfd6;font-size:.78rem;margin:7px 0 3px}
input[type=text],input[type=number],select{background:#081321;color:#e8f3ff;border:1px solid #29435f;border-radius:9px;padding:9px;font-size: .92rem;min-width:0}
button{background:linear-gradient(135deg,#1fc9f3,#2584e8);color:#03121a;border:1px solid #4de1ff;border-radius:9px;padding:10px 12px;font-weight:800;font-size:.86rem;box-shadow:0 0 13px #1bbce522}
button.sec{background:#101e30;color:#bfeaff;border:1px solid #34516e;box-shadow:none}
button:disabled{opacity:.42}
.row{gap:8px}
.note,.meta{color:#91a9c2;font-size:.72rem}
.file{border-top:1px solid #223b55;padding:8px 0}
.name{font-size:.83rem;color:#f0f8ff;font-weight:700}
.video-dims{display:inline-block;color:#4be0bd;font:700 .73rem ui-monospace,monospace;margin-top:3px}
.bar{height:6px;background:#081321}
.bar>i{background:linear-gradient(90deg,#28c7ff,#37e5a4)}
#list{max-height:26vh;overflow:auto}
#start{margin-top:3px;min-height:48px;letter-spacing:.035em}
#cancel{min-height:40px}
#info{margin:7px 0}
#log{max-height:85px!important;font-size:.68rem!important;background:#07101d!important;border-color:#1f3b57!important}
.ratio-module{margin-top:10px;background:#0c1727;border:1px solid #294966;border-radius:13px;overflow:hidden}
.ratio-module>summary{padding:12px 14px;color:#7fe7ff;font-size:.83rem;font-weight:900;letter-spacing:.04em;display:flex;justify-content:space-between;cursor:pointer}
.ratio-summary-hint{font-size:.68rem;color:#8ba8c2;font-weight:500}
#ratioPanel{padding:0 10px 10px;max-height:65vh;overflow:auto}
#ratioPanel .container{max-width:none;gap:8px}
#ratioPanel header{display:none}
#ratioPanel .card{padding:10px;margin:0;box-shadow:none;background:#0e1b2c;border-color:#233e5b}
#ratioPanel .section-title{font-size:.68rem;margin-bottom:8px}
#ratioPanel .screen-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:8px}
#ratioPanel .stat-box{padding:7px;background:#0a1524}
#ratioPanel .stat-label{font-size:.63rem}
#ratioPanel .stat-value{font-size:.78rem;overflow-wrap:anywhere}
#ratioPanel .stat-sub{font-size:.61rem}
#ratioPanel .btn-row{gap:5px}
#ratioPanel button{font-size:.68rem;padding:6px 7px}
#ratioPanel .input-row{grid-template-columns:1fr auto 1fr;gap:7px}
#ratioPanel .input-group label{font-size:.68rem;margin-bottom:3px}
#ratioPanel .input-group input{font-size:1rem;padding:7px}
#ratioPanel .swap-btn{height:37px;padding:5px 9px}
#ratioPanel .presets{gap:5px;margin-top:8px}
#ratioPanel .preset-chip{font-size:.63rem;padding:4px 7px}
#ratioPanel .results-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
#ratioPanel .result-card{padding:8px}
#ratioPanel .result-big{font-size:1.08rem}
#ratioPanel .result-desc{font-size:.63rem}
#ratioPanel .correction-box{font-size:.68rem;padding:8px;margin-top:8px}
#ratioPanel .preview-wrapper{min-height:125px;padding:8px;margin-top:8px}
#ratioPanel .box-stage{height:90px}
#ratioPanel .legend{font-size:.63rem;gap:8px;margin-top:6px}
#ratioPanel details{background:#0b1727}
#ratioPanel summary{font-size:.72rem;padding:9px}
#ratioPanel .steps-body{font-size:.72rem}
#ratioPanel .step-list{font-size:.68rem;max-height:120px}
@media(min-width:760px){
 main{padding:16px 22px}
 #list{max-height:24vh}
 .watermark-layout{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
}
@media(max-width:520px){
 .app-head{gap:9px}
 .brand-mark{width:38px;height:38px}
 .row{gap:6px}
 #ratioPanel .screen-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
 #ratioPanel .input-row{grid-template-columns:1fr auto 1fr}
 #ratioPanel .results-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
 #ratioPanel .preview-wrapper{display:none}
}

</style>
<style>
/* compact layout: everything fits on one phone screen */
main{padding:8px 10px !important;max-width:640px}
.card{padding:9px 10px !important;margin-bottom:8px !important;border-radius:12px !important}
label{font-size:.72rem !important;margin:6px 0 2px !important}
input[type=text],input[type=number],select{padding:7px 9px !important;font-size:.92rem !important;border-radius:9px !important}
button{padding:10px 12px !important;font-size:.9rem !important}
.row{gap:8px !important}
#list{margin-top:4px !important;max-height:110px;overflow:auto}
#list .file{padding:5px 0 !important}
#list .name{font-size:.8rem !important}
#list .meta{font-size:.7rem !important}
#colorPicker{height:36px !important;width:48px !important}
#preview{margin-top:6px !important;padding:4px 8px !important;font-size:.82rem !important}
#info{margin:4px 0 !important;font-size:.75rem !important}
#log{max-height:64px !important;font-size:.7rem !important;padding:5px 8px !important;margin:0 0 8px !important}
</style>
</head>
<body>
<main>
<div class="card">
  <input id="pickerAll" type="file" multiple class="hide">
  <input id="pickerVideo" type="file" accept="video/*" multiple class="hide">
  <div class="row">
    <div><button id="pickAll" style="width:100%">File manager</button></div>
    <div><button id="pickVideo" class="sec" style="width:100%">Gallery</button></div>
  </div>
  <div id="list" style="margin-top:8px"></div>
</div>

<div class="card">
  <label for="dateMode">Date in watermark</label>
  <select id="dateMode">
    <option value="auto">Automatic (recording date)</option>
    <option value="manual">Manual date</option>
    <option value="none">No date</option>
  </select>
  <div id="manualBox" class="hide"><label for="manualDate">Date text</label><input id="manualDate" type="text" placeholder="NOV-07-2026"></div>

  <label for="text">Watermark text</label>
  <input id="text" type="text" value="BY_[MiSi], ">

  <div class="row">
    <div><label for="res">Resolution</label>
      <select id="res"><option value="0">Original</option><option value="1080">1080p</option><option value="720" selected>720p (recommended)</option><option value="640">640p</option><option value="480">480p</option><option value="360">360p</option><option value="custom">Custom...</option></select>
      <input id="customRes" type="number" min="100" max="4320" step="2" value="720" class="hide" style="margin-top:6px;width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--fg)"></div>
    <div><label for="quality">Compression</label>
      <select id="quality"><option value="5000000">High (5 Mbps)</option><option value="2500000" selected>Normal (2.5 Mbps)</option><option value="1200000">Small (1.2 Mbps)</option></select></div>
  </div>
    <div class="row"><input id="colorPicker" type="color" value="#90ee90" style="width:56px;height:42px;padding:2px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);flex:none"><input id="color" type="text" value="lightgreen" placeholder="lightgreen or #90ee90"></div>
  <div id="preview" style="display:inline-block;margin-top:4px;padding:6px 10px;border-radius:6px;background:rgba(0,0,0,.5);font-family:Verdana,sans-serif;font-size:.95rem"></div>
</div>

<button id="start" disabled style="width:100%">START WATERMARKING</button>
<button id="cancel" class="sec hide" s
